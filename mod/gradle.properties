# Fabric-Eigenschaften fuer Minecraft 1.21.11
# Quellen (am 2026-09-02 geprueft):
#   https://meta.fabricmc.net/v2/versions/yarn/1.21.11   -> 1.21.11+build.6 (stable: true)
#   https://meta.fabricmc.net/v2/versions/loader/1.21.11 -> 0.19.5         (stable: true)
#   FabricMC/fabric-example-mod, Branch 1.21.11          -> loom 1.17-SNAPSHOT,
#                                                           fabric-api 0.141.6+1.21.11, Java 21
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod
mod_version=1.0.0
maven_group=net.invchecker
archives_base_name=invchecker

# Abhaengigkeiten
fabric_version=0.141.6+1.21.11

# Hinweis zu den Mappings: Diese Mod benutzt weiterhin Yarn
# ("net.fabricmc:yarn:...:v2" in build.gradle). Yarn existiert fuer 1.21.11 und
# ist als stable markiert. Fabrics eigenes Repo ist zwar schon auf Mojang-
# Mappings umgestellt, Loom remapped fabric-api aber ueber Intermediary, sodass
# eine Yarn-Mod sie problemlos nutzen kann.
# Ab Minecraft 26.1 ist Yarn nicht mehr offiziell unterstuetzt – dann waere eine
# Migration auf Mojang-Mappings noetig (jede Klassen-/Methoden-Name aendert sich).
